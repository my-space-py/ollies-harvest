<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- 홈 화면에 추가(웹앱) 설정: 주소창 없이 앱처럼 실행 -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#fff6d8" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="올리의 수확" />
  <link rel="apple-touch-icon" href="./assets/images/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="./assets/images/icons/app-icon-192.png" />
  <title>로그인 / 회원가입</title>
  <link rel="stylesheet" href="css/auth.css?v=2">
</head>
<body>
  <main class="auth-container">
    <div class="auth-card">
      <img class="auth-logo" src="./assets/images/branding/logo_ollies_harvest.png" alt="올리의 수확">

      <p class="auth-message" id="authMessage"></p>

      <!-- 로그인 폼 -->
      <form id="loginForm" class="auth-form">
        <label for="loginUsername">아이디</label>
        <input type="text" id="loginUsername" required autocomplete="username">

        <label for="loginPassword">비밀번호</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">

        <button type="submit" class="submit-btn">로그인</button>

        <p class="auth-switch">아직 계정이 없으신가요? <a href="#" id="showSignup" class="auth-link">회원가입</a></p>
      </form>

      <!-- 회원가입 폼 -->
      <form id="signupForm" class="auth-form hidden">
        <label for="signupNickname">닉네임</label>
        <input type="text" id="signupNickname" required>

        <label for="signupUsername">아이디</label>
        <input type="text" id="signupUsername" required autocomplete="username">

        <label for="signupPassword">비밀번호</label>
        <input type="password" id="signupPassword" required autocomplete="new-password">

        <button type="submit" class="submit-btn">회원가입</button>

        <p class="auth-switch">이미 계정이 있으신가요? <a href="#" id="showLogin" class="auth-link">로그인</a></p>
      </form>
    </div>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
